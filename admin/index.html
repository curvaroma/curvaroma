<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pannello Roma+</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<style>
:root{--rosso:#8E1F2F;--scuro:#5F0E24;--giallo:#F0BC42;--fondo:#F6F1F2;--carta:#fff;--testo:#2B0A15;--muto:#6F5560;--linea:#E6D6DA}
@media (prefers-color-scheme:dark){:root{--fondo:#1E0B12;--carta:#2C1019;--testo:#F8EDEF;--muto:#C3A6AE;--linea:#4A2531;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fondo);color:var(--testo);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--scuro);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
header img{height:34px}
header b{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--carta);border-bottom:1px solid var(--linea);position:sticky;top:54px;z-index:4}
nav button{flex:none;border:0;background:none;color:var(--testo);padding:9px 12px;border-radius:8px;font:600 14px system-ui;cursor:pointer}
nav button[aria-selected="true"]{background:var(--rosso);color:#fff}
main{max-width:1000px;margin:auto;padding:18px 16px 110px;display:grid;gap:16px}
.card{background:var(--carta);border:1px solid var(--linea);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
h2{margin:0;font-size:1.15rem}h3{margin:0;font-size:1rem}
label{display:grid;gap:4px;font-weight:600;font-size:.88rem;min-width:0}
input,textarea,select{font:400 15px system-ui;color:var(--testo);background:var(--fondo);border:1px solid var(--linea);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px}
textarea{min-height:110px;resize:vertical}
.griglia{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
button.az{border:0;border-radius:8px;background:var(--rosso);color:#fff;font:600 14px system-ui;padding:10px 14px;cursor:pointer}
button.sec{background:none;color:var(--testo);border:1px solid var(--muto)}
button.pericolo{background:none;color:#C0392B;border:1px solid #C0392B}
.riga{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-size:1.9rem;font-weight:800}
.nota{font-size:.86rem;color:var(--muto);font-weight:400}
.barre{display:grid;gap:6px}
.barra{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:.86rem}
.barra i{display:block;height:10px;border-radius:5px;background:var(--rosso)}
.barra span:last-child{text-align:right;font-weight:700}
.prod{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;border-top:1px solid var(--linea);padding-top:12px}
.prod img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--linea)}
.manca{width:96px;height:96px;border-radius:8px;display:grid;place-items:center;text-align:center;font-size:.76rem;background:#FCE8E6;color:#A5281B;padding:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;display:grid;gap:6px;font-size:.8rem}
.gal img{width:100%;height:100px;object-fit:cover;border-radius:8px}
.salva{position:fixed;left:0;right:0;bottom:0;background:var(--carta);border-top:1px solid var(--linea);padding:10px 16px;display:flex;justify-content:center;gap:12px;align-items:center;z-index:6}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.esito{font-weight:600;font-size:.9rem}
.voce{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.voce b{display:block}
.segno{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--linea);color:var(--testo)}
.segno.ok{background:#DDF3E4;color:#17603A}.segno.no{background:#FCE8E6;color:#A5281B}
.conto{font-weight:400;color:var(--muto);font-size:.8rem}.conto.no{color:#C0392B;font-weight:700}
.google{border:1px solid var(--linea);border-radius:10px;padding:12px;background:#fff;color:#202124;font-family:Arial,sans-serif;display:grid;gap:3px;min-width:0}
.google small{color:#4d5156;overflow-wrap:anywhere}
.google strong{color:#1a0dab;font-weight:400;font-size:1.15rem;line-height:1.25;overflow-wrap:anywhere}
.google span{color:#4d5156;font-size:.86rem;line-height:1.4}
.anteprima{border:1px solid var(--linea);border-radius:10px;padding:14px;display:grid;gap:10px;max-width:68ch}
.anteprima h2,.anteprima p{margin:0}
.tabella{width:100%;border-collapse:collapse;font-size:.88rem}
.tabella th,.tabella td{text-align:left;padding:8px 6px;border-top:1px solid var(--linea);vertical-align:top}
.scorri{overflow-x:auto}
.post-griglia{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:16px;align-items:start}
.bozza-img{width:100%;height:auto;border-radius:8px;display:block}
.a-capo{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.post-griglia canvas{width:100%;height:auto;border-radius:8px;display:block}
@media (max-width:720px){.post-griglia{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="login" id="login"><form class="card" id="form-login">
  <img src="/img/logo.png" alt="Roma+" style="width:150px;margin:auto">
  <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
  <label id="l-codice" hidden>Codice dell'app, oppure codice di recupero<input id="codice" inputmode="text" autocomplete="one-time-code"></label>
  <button class="az" type="submit">Entra</button><p class="esito" id="e-login"></p>
</form></div>
<div id="app" hidden>
<header><img src="/img/logo-chiaro.png" alt=""><b>Pannello admin</b><a href="/" target="_blank" style="color:#fff">Vedi il sito</a><button class="az sec" style="color:#fff;border-color:#fff" id="esci">Esci</button></header>
<nav id="schede" role="tablist"></nav>
<main id="vista"></main>
<div class="salva" id="barra-salva" hidden><span class="esito" id="e-salva">Modifiche da pubblicare</span><button class="az" id="pubblica">Salva sul sito</button></div>
</div>
<script src="/admin/qr.js"></script>
<script>

const righe = t => t.split("\n").map(x => x.trim()).filter(Boolean);

const STATI_BOZZA = { bozza: ["Da controllare", ""], "da-rivedere": ["Resta in bozza", "no"], pubblicata: ["Pubblicata", "ok"] };

      if (b.sito?.storiaUrl) { const box = el("div"); box.style.cssText = "display:grid;gap:8px;min-width:0"; f.append(box); fetch(b.sito.storiaUrl).then(r => r.json()).then(l => { for (const a of l) { const d = el("details"), t = el("summary", "", `${a.anno}: ${a.titolo} (${conta(a.testo)} parole)`); d.append(t, el("p", "a-capo", a.testo.replace(/^## /gm, ""))); box.append(d); } }).catch(() => box.append(el("p", "esito", "Articoli non caricati"))); }
      if (b.note?.length) { const u = el("ul"); u.style.cssText = "margin:0;padding-left:20px;display:grid;gap:4px"; for (const n of b.note) u.append(el("li", "", n)); f.append(el("h3", "", "Note di Claude"), u); }
      if (b.fonti?.length) { const u = el("div", "riga"); for (const [n, url] of b.fonti) if (/^https:\/\//.test(url)) { const a = el("a", "", n); a.href = url; a.target = "_blank"; a.rel = "noopener"; u.append(a); } f.append(el("h3", "", "Fonti"), u); }

      const az = el("div", "riga"), azione = (etichetta, classe, percorso) => { const x = el("button", classe, etichetta); x.onclick = async () => {
        if (sporco) { es.textContent = "Salva prima le modifiche aperte nel pannello"; return; }
        if (percorso === "pubblica" && !window.confirm("Pubblicare questa bozza sul sito?")) return;

  },
  async traffico(v) {
    const d = await api("riepilogo");
    const gg = [...new Set(d.visite.map(x => x.giorno))], tot = g => d.visite.filter(x => x.giorno === g).reduce((a, b) => a + b.n, 0);
    const oggi = gg[gg.length - 1], somma = d.visite.reduce((a, b) => a + b.n, 0), mob = d.visite.filter(x => x.dispositivo === "mobile").reduce((a, b) => a + b.n, 0);
    const g = el("div", "griglia");
    for (const [t, n] of [["Pagine viste oggi", oggi ? tot(oggi) : 0], ["Visitatori oggi", d.unici.at(-1)?.n || 0], ["Pagine viste, 14 giorni", somma], ["Da telefono", somma ? Math.round(mob / somma * 100) + "%" : "0%"], ["Tifosi che hanno votato", d.votanti], ["Annunci biglietti", d.annunci]]) { const c = el("div", "card"); c.append(el("span", "nota", t), el("span", "num", n)); g.append(c); }

    const barre = (tit, lista) => { const c = el("div", "card"), b = el("div", "barre"), max = Math.max(1, ...lista.map(x => x[1])); c.append(el("h2", "", tit)); if (!lista.length) c.append(el("p", "nota", "Ancora nessun dato.")); for (const [n, q] of lista) { const r = el("div", "barra"), i = el("i"); i.style.width = q / max * 100 + "%"; const w = el("span"); w.append(i); r.append(el("span", "", n), w, el("span", "", q)); b.append(r); } c.append(b); v.append(c); };

  },
  async radio(v) {
    const storie = C.storia || [];
    const VOCE = "it-IT-Chirp3-HD-Algenib", g = el("div", "card"), eg = el("p", "esito"), tutti = el("button", "az", "Genera gli audio mancanti"), righe_ = el("div");

      if (!q.ok) throw new Error((await q.json().catch(() => ({}))).errore || "Salvataggio non riuscito");
    };
    const disegna = () => { righe_.textContent = ""; for (const a of storie) { const p = pronti.find(x => x.id === a.id), r = el("div", "voce"), inf = el("div"); inf.append(el("b", "", a.titolo), el("span", "nota", p ? `${Math.round(p.durata / 60)} minuti` : "Audio da generare")); r.append(inf, el("span", "segno" + (p ? " ok" : ""), p ? "Pronto" : "Manca")); righe_.append(r); } };
    tutti.onclick = async () => {
      tutti.disabled = true;
      try {
        const mancanti = storie.filter(a => !pronti.some(x => x.id === a.id));
        for (let i = 0; i < mancanti.length; i++) { eg.textContent = `Genero ${i + 1} di ${mancanti.length}: ${mancanti[i].titolo}. Non chiudere la pagina.`; await genera(mancanti[i]); pronti = (await api("radio/stato")).brani; disegna(); }
        eg.textContent = mancanti.length ? "Fatto: la radio è aggiornata." : "Non manca nessun audio.";
      } catch (e) { eg.textContent = e.message; }
      tutti.disabled = false;
    };
    g.append(el("h2", "", "Radio Curva"), el("p", "nota", "Voce Algenib. Tieni aperta la pagina mentre genera."), tutti, eg, righe_); disegna(); v.append(g);
    const d = await api("radio/ascolti"), min = x => Math.round(x / 60), tot = d.giorni.reduce((a, b) => a + b.secondi, 0), unici = d.ascoltatori.reduce((a, b) => a + b.n, 0), oggiU = d.ascoltatori.find(x => x.giorno === oggi())?.n || 0;
    const griglia = el("div", "griglia");
    for (const [t, n] of [["In ascolto ora", d.ora], ["Ascoltatori oggi", oggiU], ["Avvii oggi", d.oggi.avvii], ["Minuti oggi", min(d.oggi.secondi)], ["Ore in 14 giorni", (tot / 3600).toFixed(1).replace(".", ",")], ["Minuti per ascoltatore", unici ? min(tot / unici) : 0]]) { const k = el("div", "card"); k.append(el("span", "nota", t), el("span", "num", n)); griglia.append(k); }
    const barre = (tit, lista) => { const k = el("div", "card"), w = el("div", "barre"), max = Math.max(1, ...lista.map(x => x[1])); k.append(el("h2", "", tit)); if (!lista.length) k.append(el("p", "nota", "Ancora nessun ascolto.")); for (const [n, q] of lista) { const r = el("div", "barra"), i = el("i"), u = el("span"); i.style.width = q / max * 100 + "%"; u.append(i); r.append(el("span", "", n), u, el("span", "", q)); w.append(r); } k.append(w); return k; };
    v.prepend(griglia);
    v.append(barre("Minuti ascoltati al giorno", d.giorni.map(x => [x.giorno.slice(5), min(x.secondi)])), barre("Racconti più ascoltati, in minuti", d.brani.map(x => [storie.find(a => a.id === x.brano)?.titolo.slice(0, 22) || x.brano, min(x.secondi)])));
  },
  storia(v) {
    C.storia ||= [];
    const add = el("button", "az", "Nuovo racconto");
    add.onclick = () => { const a = { id: "bozza-" + Date.now().toString(36), stato: "bozza", anno: "", epoca: "", titolo: "", occhiello: "", riassunto: "", testo: "", seoTitolo: "", seoDescrizione: "", fonti: [] }; C.storia.unshift(a); aperto = a; segna(); apri("storia"); };
