name: App iOS
on:
  workflow_dispatch: {}
jobs:
  ios:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: app
    env:
      HA_FIRMA: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.CURVAROMA_IOS_PROVISIONING_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Scegli Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 non presente su questo runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Notifiche: servono GoogleService-Info.plist di Firebase (segreto in base64) e un profilo con Push Notifications.
      # Se manca uno dei due, il plugin si toglie e l'app esce senza notifiche ma funziona.
      - name: Notifiche (Firebase)
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          PROFILO: ${{ secrets.CURVAROMA_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          ATTIVE=no
          if [ "$HA_FIRMA" = "true" ] && [ -n "$PLIST" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/segreto.py" PROFILO $RUNNER_TEMP/prof.mobileprovision
            security cms -D -i $RUNNER_TEMP/prof.mobileprovision > $RUNNER_TEMP/prof.plist
            if /usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' $RUNNER_TEMP/prof.plist >/dev/null 2>&1; then
              ATTIVE=si
            else
              echo "::warning::Il profilo di provisioning non ha Push Notifications: rigeneralo dopo averle attivate sull'App ID. Build senza notifiche."
            fi
          else
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_BASE64 o firma assenti: build senza notifiche."
          fi
          if [ "$ATTIVE" = si ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/segreto.py" PLIST ios/App/App/GoogleService-Info.plist
            echo "PUSH_IOS=si" >> $GITHUB_ENV
            echo "Notifiche attive"
          else
            npm uninstall --no-save @capacitor-firebase/messaging
          fi
      - run: npx cap sync ios
      - name: Installa CocoaPods
        working-directory: app/ios/App
        run: pod install
      - name: Aggiungi Firebase e notifiche al progetto Xcode
        if: env.PUSH_IOS == 'si'
        working-directory: app/ios/App
        run: ruby "$GITHUB_WORKSPACE/.github/scripts/xcode-notifiche.rb"
      - name: Prova di compilazione senza firma
        if: env.HA_FIRMA != 'true'
        working-directory: app/ios/App
        run: |
          echo "::warning::Certificato o profilo assenti: compilo solo per il simulatore, nulla viene caricato."
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Importa certificato e profilo
        if: env.HA_FIRMA == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILO: ${{ secrets.CURVAROMA_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/firma.keychain-db; PW=$(openssl rand -base64 12)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > $RUNNER_TEMP/c.p12
          security import $RUNNER_TEMP/c.p12 -k "$KC" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security find-certificate -a -p "$KC" | openssl x509 -noout -subject -enddate | sed 's/^/Certificato: /'
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          F=~/Library/MobileDevice/Provisioning\ Profiles/curvaroma.mobileprovision
          python3 "$GITHUB_WORKSPACE/.github/scripts/segreto.py" PROFILO "$F"
          security cms -D -i "$F" > $RUNNER_TEMP/p.plist
          echo "PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' $RUNNER_TEMP/p.plist)" >> $GITHUB_ENV
      - name: Firma nel progetto Xcode
        if: env.HA_FIRMA == 'true'
        working-directory: app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          P=App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" $P
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $APPLE_TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";/g" $P
      - name: Archivia
        if: env.HA_FIRMA == 'true'
        working-directory: app/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS -archivePath $RUNNER_TEMP/App.xcarchive archive
      - name: Esporta l'ipa
        if: env.HA_FIRMA == 'true'
        working-directory: app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>it.curvaroma.app</key><string>$PROFILE_UUID</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $RUNNER_TEMP/export
      - name: Carica su App Store Connect
        if: env.HA_FIRMA == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          CHIAVE: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$CHIAVE" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f "$(find $RUNNER_TEMP/export -name '*.ipa' | head -n 1)" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
