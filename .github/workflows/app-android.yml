name: App Android
on:
  workflow_dispatch: {}
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Notifiche: servono il google-services.json di Firebase (segreto in base64). Senza, la build esce senza notifiche.
      - name: Notifiche (Firebase)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" | base64 -d > android/app/google-services.json
            echo "Notifiche attive"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 assente: build senza notifiche."
            npm uninstall --no-save @capacitor-firebase/messaging
          fi
      - run: npx cap sync android
      - name: Keystore di firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.CURVAROMA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/curvaroma-release.keystore
          else
            echo "::warning::Keystore assente: il bundle non sarà firmato e non si può caricare su Google Play."
          fi
      - name: Compila il bundle
        working-directory: app/android
        env:
          CURVAROMA_KEYSTORE_PASSWORD: ${{ secrets.CURVAROMA_ANDROID_KEYSTORE_PASSWORD }}
          CURVAROMA_KEY_ALIAS: ${{ secrets.CURVAROMA_ANDROID_KEY_ALIAS }}
          CURVAROMA_KEY_PASSWORD: ${{ secrets.CURVAROMA_ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: curvaroma-android
          path: app/android/app/build/outputs/bundle/release/app-release.aab
